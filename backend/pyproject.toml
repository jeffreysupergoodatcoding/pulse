[project]
name = "pulse"
version = "1.0.0"
description = "Social Sentiment Intelligence Platform"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "openai>=1.0.0",
    "camel-ai==0.2.78",
    "zep-cloud==3.13.0",
    "praw>=7.7.0",
    "tweepy>=4.14.0",
    "google-api-python-client>=2.0.0",
    "feedparser>=6.0.0",
    "vaderSentiment>=3.3.2",
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pydantic>=2.0.0",
    "redis>=5.0.0",
    "python-dotenv>=1.0.0",
    "uvicorn>=0.29.0",
    "camel-oasis==0.2.5",
]

[project.optional-dependencies]
transformer = [
    "transformers>=4.40.0",
    "torch>=2.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "simulations"]
